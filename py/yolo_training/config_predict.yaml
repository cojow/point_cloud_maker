# Everything predict.py needs lives in this file - edit it, then run predict.py.

# The training run whose weights/best.pt makes the predictions.
model:
  run: train_orem            # folder in data/yolo/runs/

# The images to predict on.
image_set: orem_windsor_seed15   # folder in data/yolo/sets/ whose images/ folder is used

# Name of the output folder in data/yolo/runs/; the detections CSV inside it is named <output_name>.csv.
output_name: orem_windsor

# Minimum confidence for a detection to be kept. null uses the Ultralytics default (0.25).
conf_threshold: null

save_csv: true               # one row per detection (box, class, confidence), for downstream scripts
save_image: false            # also save a copy of every image with the boxes drawn on it
